name: trado_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Tooling
  flutter_bloc: ^8.1.2
  equatable: ^2.0.5
  get_it: ^8.2.0
  go_router: ^14.0.0

  # Networking & serialization
  dio: ^5.9.0
  retrofit: ^4.0.1
  json_annotation: ^4.8.1

  # Storage & Preferences
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.1.1
  drift: ^2.28.1

  # UI & Design
  intl: ^0.18.1
  fl_chart: ^0.60.0

  # Utilities
  dartz: ^0.10.1
  drift_flutter: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # Code Generators
  build_runner: ^2.4.6
  json_serializable: ^6.6.2
  retrofit_generator: ^9.3.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true